[workspace]
resolver = "3"
members = ["crates/kyxen-hidpp", "crates/kyxen-core", "crates/kyxend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Piktrip/kyxen-rs"
authors = ["Piktrip", "Wade Quinn (original Kyxen)"]

[workspace.dependencies]
kyxen-hidpp = { path = "crates/kyxen-hidpp" }
kyxen-core = { path = "crates/kyxen-core" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
evdev = "0.13"
rustix = { version = "1.1", features = ["event", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
thiserror = "2.0"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
