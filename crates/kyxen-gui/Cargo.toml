[package]
name = "kyxen-gui"
description = "Kyxen settings app: profiles, G-key macros and per-key lighting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "kyxen"
path = "src/main.rs"

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
kyxen-core.workspace = true
kyxen-report.workspace = true
png = "0.17"
# ~1.18: the winit accessor (unstable-winit-030) may change in minor releases
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility", "unstable-winit-030"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# XDG activation on the live Wayland surface (same versions winit uses)
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
